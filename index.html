<script>

let speciesToEditIndex, plantingToEditIndex, pendingDelete

//names of species whose plantings are expanded, so the state survives a re-render
const openSpecies = new Set()

function openTab(evt, tabName) {

  // Declare all variables
  var i, tabcontent, tablinks;

  //Get all elements with class="tabcontent" and hide them
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }

  // Get all elements with class="tablinks" and remove the class "active"
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }

  // Show the current tab, and add an "active" class to the button that opened the tab
  document.getElementById(tabName).style.display = "block";
  evt.currentTarget.className += " active";
  document.getElementById("searchRow").style.display = tabName === "List" ? "" : "none";
  
  //add the content to the tab's div
  switch(tabName) {
  case "List":
    populateList()
    break;
  case "Map":
    drawMap()
    break;
  default:
    // code block
  }
}
 
//search matches the plant name or any of its plantings' sources, ignoring case
function matchesSearch(species, query) {
  if (!query) {return true}
  if (species.name.toLowerCase().includes(query)) {return true}
  return species.plantings.some(planting => (planting.source ?? "").toLowerCase().includes(query))
}

function populateList() {

  let content = ''
  let shown = 0
  const query = document.getElementById("searchBox").value.trim().toLowerCase()
  gardenData = gardenData.sort((a, b) => a.name.localeCompare(b.name));
  for (let s = 0; s<gardenData.length; s++) {
	if (!matchesSearch(gardenData[s], query)) {continue}
	shown++
	const isOpen = openSpecies.has(gardenData[s].name)
	content = content + '<div class="speciesEntry"><div class="name"><i class="fa ' + (isOpen ? 'fa-minus-square' : 'fa-plus-square') + '" style="font-size:14px; color:DimGray" onClick = "openRecord(this,' + s + ')" ></i><i class="fa fa-pencil-square-o" style="font-size:14px; color:DimGray" onClick = "showDialogEditName(' + s + ')" ></i><i class="fa fa-trash-o deleteIcon" style="font-size:14px; color:#c0392b" onClick = "confirmDeleteSpecies(' + s + ')" ></i>' + escapeHtml(gardenData[s].name) + '</div>'
	let plantings = gardenData[s].plantings
	content=content+'<div class="plantings" style="display:' + (isOpen ? 'block' : 'none') + '">'
	for (let p=0; p<plantings.length; p++) {
		content=content+'<div class="planting"><i class="fa fa-pencil-square-o" style="font-size:14px; color:DimGray;" onClick = "editPlanting(' + s + ',' + p + ')" ></i><i class="fa fa-trash-o deleteIcon" style="font-size:14px; color:#c0392b" onClick = "confirmDeletePlanting(' + s + ',' + p + ')" ></i>'
		switch(plantings[p].source) {
			case "Original":
				content = content + '<div class="source" style="display:inline">Source: original</div>'
				break;
			case "Transplant":
				content = content + '<div class="source" style="display:inline">Source: transplant</div>'
				break;
			case "":
				content = content + '<div class="source" style="display:inline">Source: unknown</div>'
				break;
			default:
				content = content + '<div class="source" style="display:inline">Source: ' + escapeHtml(plantings[p].source) + '</div>'
		}
		if (plantings[p].date_planted) {
			content = content + '<div class="planted" style="display:block">Planted: ' + escapeHtml(plantings[p].date_planted) + '</div>'
		}
		if (plantings[p].baseline) {
			content = content + '<div class="location" style="display:block">Location: baseline=' + plantings[p].baseline + '; x=' + plantings[p].x + '; y=' + plantings[p].y + '</div>'
		}
		content = content + '</div>'
	}
	content = content + '<p><button class="button" type="button" onclick="addNewPlanting(' + s + ')">Add new planting</button></div></div>'
  }

  let header = '<p><button class="button" type="button" onclick="showDialogAddNewSpecies()">Add new species or variety</button>&nbsp;&nbsp;&nbsp;<button class="button" type="button" onClick="saveClicked()">Save</button><p>'
  if (query) {
    header = header + '<div class="searchSummary">' + (shown ? 'Showing ' + shown + ' of ' + gardenData.length + ' plants' : 'No plants match "' + escapeHtml(query) + '"') + '</div>'
  }
  document.getElementById("List").innerHTML = header + content
}

function clearSearch() {
  document.getElementById("searchBox").value = ""
  populateList()
}

function showDialogAddNewSpecies() {
  dialogAddNewSpecies.showModal()
}

function showDialogEditName(s) {
  document.getElementById("editSpeciesName").value = gardenData[s].name
  dialogEditSpecies.showModal()
  speciesToEditIndex = s
}

function editName() {
  let newName = document.getElementById("editSpeciesName").value.trim()
  if (!newName) {
    window.alert("Please enter a name.")
    return
  }
  let oldName = gardenData[speciesToEditIndex].name
  if (openSpecies.delete(oldName)) {openSpecies.add(newName)}
  gardenData[speciesToEditIndex].name = newName
  markUnsaved()
  populateList()
  dialogEditSpecies.close()
}

//the planting dialog doubles as "add": a null planting index means a new planting
function addNewPlanting(s) {
  showPlantingDialog(s, null, {}, "Add a planting")
}

function editPlanting(s,p) {
  showPlantingDialog(s, p, gardenData[s].plantings[p], "Edit this planting")
}

function showPlantingDialog(s, p, planting, title) {
  speciesToEditIndex = s
  plantingToEditIndex = p
  document.getElementById("plantingDialogTitle").textContent = title
  document.getElementById("editPlantingSpeciesName").textContent = gardenData[s].name
  document.getElementById("editPlantingSource").value = planting.source ?? ""
  document.getElementById("editPlantingDatePlanted").value = planting.date_planted ?? ""
  document.getElementById("editPlantingBaseline").value = planting.baseline ?? ""
  document.getElementById("editPlantingX").value = planting.x ?? ""
  document.getElementById("editPlantingY").value = planting.y ?? ""
  dialogEditPlanting.showModal()
}

//reads a number box: null if left empty, NaN (after warning the user) if it isn't a number
function readNumberField(id, label) {
  const text = document.getElementById(id).value.trim()
  if (text === "") {return null}
  const value = Number(text)
  if (Number.isNaN(value)) {window.alert(label + " must be a number, e.g. 150")}
  return value
}

//an empty number box removes that value from the planting
function setOrRemove(planting, key, value) {
  if (value === null) {delete planting[key]} else {planting[key] = value}
}

function savePlanting() {
  const baseline = readNumberField("editPlantingBaseline", "Baseline")
  const x = readNumberField("editPlantingX", "x")
  const y = readNumberField("editPlantingY", "y")
  if ([baseline, x, y].some(Number.isNaN)) {return}

  const species = gardenData[speciesToEditIndex]
  const isNew = plantingToEditIndex === null
  const planting = isNew ? {} : species.plantings[plantingToEditIndex]

  //every field is written back, so clearing a box clears the value
  planting.source = document.getElementById("editPlantingSource").value.trim()
  planting.date_planted = document.getElementById("editPlantingDatePlanted").value.trim()
  setOrRemove(planting, "baseline", baseline)
  setOrRemove(planting, "x", x)
  setOrRemove(planting, "y", y)
  if (isNew) {
    species.plantings.push(planting)
    openSpecies.add(species.name)  //show the plant open so the new planting is visible
  }
  markUnsaved()
  populateList()
  dialogEditPlanting.close()
}

function drawMap() {
  
  //create the drawing canvas
  document.getElementById("Map").innerHTML = '<canvas id="mapCanvas" width="1040" height="2840"></canvas>'

  
  //get the canvas element and its 2D drawing context
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');

  const baseline3OriginX = 1008.428569, baseline3OriginY = 25.285705, baseline3EndX = 16.428569, baseline3EndY = 25.285705, baseline3Length = 2012

  //add an event liostener for mouse clicks
  canvas.addEventListener('click', function(event) {
    // Get the bounding rectangle of the canvas
    const rect = canvas.getBoundingClientRect();
    
    // Calculate coordinates relative to the canvas
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    
    console.log(`Canvas X: ${x}, Canvas Y: ${y}`);
  });

  //load the background block plan raster
  //create a new HTMLImageElement instance
  const img = new Image();

  //define what happens AFTER the image file loads
  img.onload = function() {
    // Arguments: source_image, destination_x, destination_y
    ctx.drawImage(img, 0, 0); 
	
    // Draw a filled blue circle with a black outline at (200, 250)
    drawCircle(ctx, 200, 25.28, 10, 'green', 'white', 1);


  };

  //set the image path to trigger the load
  img.src = 'block plan.png';
  
  }

function drawCircle(ctx, x, y, radius, fillColor, strokeColor = 'transparent', strokeWidth = 1) {
    ctx.beginPath();
    // arc(x, y, radius, startAngle, endAngle)
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    
    // Apply fill
    if (fillColor) {
        ctx.fillStyle = fillColor;
        ctx.fill();
    }
    
    // Apply stroke
    if (strokeColor && strokeColor !== 'transparent') {
        ctx.lineWidth = strokeWidth;
        ctx.strokeStyle = strokeColor;
        ctx.stroke();
    }
}

function openRecord(element, s) {
  const name = gardenData[s].name
  const children = element.parentElement.parentElement.children
  const isOpening = element.classList.contains("fa-plus-square")

  if (isOpening) {
    element.classList.replace("fa-plus-square", "fa-minus-square")
    openSpecies.add(name)
  } else {
    element.classList.replace("fa-minus-square", "fa-plus-square")
    openSpecies.delete(name)
  }

  for (let c=0; c<children.length; c++) {
    if (children[c].className === "plantings") {
      children[c].style = isOpening ? "display: block" : "display: none"
    }
  }
}

function toggleDeleteMode(checkbox) {
  document.body.classList.toggle("deleteMode", checkbox.checked)
}

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
}

function confirmDeleteSpecies(s) {
  const species = gardenData[s]
  const n = species.plantings.length
  pendingDelete = {type: "species", s: s, name: species.name}
  document.getElementById("confirmDeleteMessage").innerHTML =
    'Delete <b>' + escapeHtml(species.name) + '</b> and its ' + n + ' planting' + (n === 1 ? '' : 's') + '?'
  dialogConfirmDelete.showModal()
}

function confirmDeletePlanting(s, p) {
  const species = gardenData[s]
  const planting = species.plantings[p]
  const bits = []
  if (planting.source) {bits.push(planting.source)}
  if (planting.date_planted) {bits.push('planted ' + planting.date_planted)}
  if (planting.baseline) {bits.push('baseline ' + planting.baseline)}
  const detail = bits.length ? ' (' + escapeHtml(bits.join(', ')) + ')' : ''
  pendingDelete = {type: "planting", s: s, name: species.name, index: p}
  document.getElementById("confirmDeleteMessage").innerHTML =
    'Delete this planting of <b>' + escapeHtml(species.name) + '</b>' + detail + '?'
  dialogConfirmDelete.showModal()
}

function performDelete() {
  if (!pendingDelete) {return}

  //use the index the bin was clicked on - looking up by name would hit the wrong entry when two
  //plants share a name. The name check guards against the list having changed since.
  const s = pendingDelete.s
  if (gardenData[s]?.name !== pendingDelete.name) {
    console.warn('Nothing deleted - the list changed since the bin was clicked:', pendingDelete.name)
  } else if (pendingDelete.type === "species") {
    openSpecies.delete(pendingDelete.name)
    gardenData.splice(s, 1)
  } else {
    gardenData[s].plantings.splice(pendingDelete.index, 1)
  }

  markUnsaved()
  cancelDelete()
  getnSpecies()
  populateList()
}

function cancelDelete() {
  pendingDelete = null
  dialogConfirmDelete.close()
}



function parsePayload(parsed) {
  if (Array.isArray(parsed)) return { lastModified: 0, data: parsed };
  return parsed;
}

function formatTs(ts) {
  return new Date(ts).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function mergeGardenData(localPayload, githubPayload) {
  const localMap = new Map(localPayload.data.map(p => [p.name, p]));
  const githubMap = new Map(githubPayload.data.map(p => [p.name, p]));
  const allNames = new Set([...localMap.keys(), ...githubMap.keys()]);
  const localTime = formatTs(localPayload.lastModified);
  const githubTime = formatTs(githubPayload.lastModified);
  const merged = [];

  for (const name of allNames) {
    const local = localMap.get(name);
    const remote = githubMap.get(name);
    if (local && !remote) {
      merged.push(local);
    } else if (!local && remote) {
      merged.push(remote);
    } else if (JSON.stringify(local) === JSON.stringify(remote)) {
      merged.push(local);
    } else {
      merged.push({ ...local, name: `${name} [local ${localTime}]` });
      merged.push({ ...remote, name: `${name} [github ${githubTime}]` });
    }
  }

  return merged;
}

// Cloudflare Worker that reads and saves garden_data.js on GitHub (see README.md).
// Paste the deployed Worker URL here. Until then, loading falls back to the copy in localStorage.
// Going through the API rather than raw.githubusercontent.com avoids its ~5 min CDN cache.
const DATA_URL = 'https://gsgarden-proxy.kevin-thiele.workers.dev';

function githubHeaders() {
  // The Worker adds the token and GitHub headers itself, and its CORS setup only accepts Content-Type
  return { 'Content-Type': 'application/json' };
}

async function loadGardenData() {
  let githubPayload = null;
  let localPayload = null;

  try {
    if (!DATA_URL) throw new Error('DATA_URL is not set');
    const response = await fetch(DATA_URL, { headers: githubHeaders(), cache: 'no-store' });
    if (!response.ok) throw new Error('Fetch failed');
    const fileData = await response.json();
    const jsonString = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
    githubPayload = parsePayload(JSON.parse(jsonString));
  } catch (error) {
    console.warn('Could not fetch from GitHub:', error);
  }

  const stored = localStorage.getItem('gardenData');
  if (stored) localPayload = parsePayload(JSON.parse(stored));

  if (githubPayload && localPayload) {
    if (localPayload.lastModified > githubPayload.lastModified) {
      gardenData = mergeGardenData(localPayload, githubPayload);
      console.warn('Local data is newer — merging and syncing to GitHub');
      try {
        await saveObjectToGitHub();
      } catch (error) {
        console.warn('Sync-on-load failed — continuing with local data:', error);
      }
    } else {
      gardenData = githubPayload.data;
      localStorage.setItem('gardenData', JSON.stringify(githubPayload));
    }
  } else if (githubPayload) {
    gardenData = githubPayload.data;
    localStorage.setItem('gardenData', JSON.stringify(githubPayload));
  } else if (localPayload) {
    gardenData = localPayload.data;
    console.warn('Loaded from localStorage (offline fallback)');
  } else {
    gardenData = [];
    console.error('No data available - starting empty');
  }

  getnSpecies();
  populateList();
  document.getElementById("List").style.display = "block";
}

async function saveObjectToGitHub() {
  if (!DATA_URL) throw new Error('DATA_URL is not set - paste the Cloudflare Worker URL into index.html');
  const url = DATA_URL;
  const headers = githubHeaders();

  const payload = { lastModified: Date.now(), data: gardenData };
  const jsonString = JSON.stringify(payload, null, 2);
  const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

  let sha = null;
  try {
    const checkResponse = await fetch(url, { method: 'GET', headers, cache: 'no-store' });
    if (checkResponse.ok) {
      const fileData = await checkResponse.json();
      sha = fileData.sha;
    }
  } catch (error) {
    console.log('File does not exist yet, will create.', error);
  }

  const bodyData = {
    message: 'docs: update garden data via app',
    content: base64Content,
  };
  if (sha) bodyData.sha = sha;

  const response = await fetch(url, {
    method: 'PUT',
    headers,
    body: JSON.stringify(bodyData)
  });

  if (!response.ok) {
    const errorDetails = await response.json();
    throw new Error(`GitHub API Error: ${errorDetails.message}`);
  }

  localStorage.setItem('gardenData', JSON.stringify(payload));
  return await response.json();
}

let hasUnsavedChanges = false, saving = false

function showSaveStatus(message, kind) {
  const status = document.getElementById("saveStatus")
  status.textContent = message
  status.className = kind
}

function markUnsaved() {
  hasUnsavedChanges = true
  showSaveStatus("Unsaved changes - press Save to keep them", "unsaved")
}

async function saveClicked() {
  if (saving) {return}
  saving = true
  showSaveStatus("Saving...", "pending")
  try {
    await saveObjectToGitHub()
    hasUnsavedChanges = false
    showSaveStatus("Saved at " + new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }), "saved")
  } catch (error) {
    console.error('Save failed:', error)
    showSaveStatus("Save failed - your changes are still on screen. Check your connection and press Save again.", "failed")
  } finally {
    saving = false
  }
}

//warn before closing or reloading the page with unsaved changes
window.addEventListener("beforeunload", event => {
  if (hasUnsavedChanges) {event.preventDefault()}
})

function getnSpecies () {
	let nSpecies = gardenData.length
	document.getElementById("nSpecies").innerHTML = "<p>Number of species and varieties = " + nSpecies
}

function addSpecies() {
	let species = document.getElementById("newSpecies").value.trim()
	if (!species) {
		window.alert("Please enter a name.")
		return
	}
	let baseline = readNumberField("newBaseline", "Baseline")
	let x = readNumberField("newX", "x")
	let y = readNumberField("newY", "y")
	if ([baseline, x, y].some(Number.isNaN)) {return}

	let planting = {
		source: document.getElementById("newSource").value.trim(),
		date_planted: document.getElementById("newDatePlanted").value.trim()
	}
	setOrRemove(planting, "baseline", baseline)
	setOrRemove(planting, "x", x)
	setOrRemove(planting, "y", y)
	gardenData.push({name: species, plantings: [planting]})

	//clear the boxes so the next add starts empty
	document.querySelectorAll("#dialogAddNewSpecies input").forEach(input => {input.value = ""})
	dialogAddNewSpecies.close()
	//clear any search and open the new plant so it can be seen
	document.getElementById("searchBox").value = ""
	openSpecies.add(species)
	markUnsaved()
	getnSpecies()
	populateList()
}

</script>
